[project]
name = "caligula"
version = "0.1.0"
description = "Retcon-resistant evidence engine for investigating public-interest allegations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pillow>=10.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
caligula = "caligula.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caligula = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["caligula"]
