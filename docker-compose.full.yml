# Full stack: Postgres/pgvector + replay-only API + web UI.
# All persistent data lives under /home/mohamed/Desktop/data2/caligula-docker/.
# Replay-only: no model key needed. Add LLM keys later via `api.environment`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: caligula
      POSTGRES_USER: caligula
      POSTGRES_PASSWORD: caligula
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caligula -d caligula"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - /home/mohamed/Desktop/data2/caligula-docker/pgdata:/var/lib/postgresql/data
      - ./src/caligula/adapters/persistence/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      # Inside the compose network SearXNG is the `search` service, not localhost
      # (the .env value is for CLI runs on the host).
      CALIGULA_SEARXNG_URL: http://search:8080
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/cases')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - /home/mohamed/Desktop/data2/caligula-docker/blobs:/data/blobs
      - /home/mohamed/Desktop/data2/caligula-docker/cases:/data/cases
      - /home/mohamed/Desktop/data2/caligula-docker/out:/data/out
    # API + interface, documents persisted in Postgres, one ledger file per case.
    command: ["caligula", "serve", "--host", "0.0.0.0", "--port", "8000",
              "--replay", "fixtures/steg_synthetic",
              "--ledgers", "/data/cases", "--blobs", "/data/blobs",
              "--db", "postgresql://caligula:caligula@db:5432/caligula"]
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_started

  web:
    build:
      context: ./web
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy

  search:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: caligula-local-dev-secret-change-me
    ports: ["8888:8080"]
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
